name: "Deploy MkDocs site to gh-pages"
on:
  workflow_call:

jobs:
  check_docs_files_change:
    name: "Detect documentation changes"
    runs-on: ubuntu-latest
    #   needs.check_docs_files_change.outputs.DOCS_FILES_CHANGED
    outputs:
      DOCS_FILES_CHANGED: ${{ steps.docs_changed.outputs.any_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'recursive'
      #   steps.docs_changed.outputs.any_changed
      - name: Check whether docs sources changed
        id: docs_changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            docs/**
            mkdocs.yml
  deploy:
    name: "Build and publish MkDocs site"
    needs: [ check_docs_files_change ]
    if: needs.check_docs_files_change.outputs.DOCS_FILES_CHANGED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.x
      - name: Install mkdocs-material
        run: pip install mkdocs-material
      - name: Install mkdocs-minify-plugin
        run: pip install mkdocs-minify-plugin
      - name: Build and push site to gh-pages
        run: mkdocs gh-deploy --force
