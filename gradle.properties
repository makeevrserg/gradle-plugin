# Gradle
kotlin.code.style=official
kotlin.incremental=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.isolated-projects=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.tooling.parallel=true
# Java
klibs.java.source=8
klibs.java.target=17
klibs.java.ktarget=17
# Config
klibs.project.name=GradlePlugin
klibs.project.description=GradlePlugin for my kotlin projects
klibs.project.group=ru.astrainteractive.gradleplugin
klibs.project.url=https://github.com/makeevrserg/gradle-plugin
klibs.project.version.string=2.7.0
